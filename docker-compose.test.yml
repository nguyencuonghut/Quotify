services:
  backend-test:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    command: >
      sh -lc "uv sync &&
      .venv/bin/pytest &&
      .venv/bin/ruff check . &&
      .venv/bin/mypy . &&
      .venv/bin/bandit -c pyproject.toml -s B104 -r app"
    env_file:
      - .env
    environment:
      APP_ENV: test
      APP_DEBUG: "false"
      PYTHONPATH: /app
      POSTGRES_HOST: postgres-test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-test:5432/app_test
      REDIS_URL: redis://redis-test:6379/0
      SMTP_HOST: mailpit-test
      SMTP_PORT: 1025
      # `.env` dev có thể chứa bot Telegram thật: test không bao giờ được dùng nó.
      TELEGRAM_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_USERNAME: ""
      TELEGRAM_WEBHOOK_SECRET: ""
    depends_on:
      postgres-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mailpit-test:
        condition: service_healthy

  frontend-test:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
    command: sh -lc "npm install && npm run lint && npm run typecheck && npm run test:unit"

  frontend-e2e:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 4173"
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://backend-e2e:8000
      VITE_APP_NAME: "${VITE_APP_NAME:-FastApiVue}"
    depends_on:
      backend-e2e:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:4173").then((response) => {
            if (!response.ok) process.exit(1);
          }).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend-e2e:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    command: >
      sh -lc "uv sync &&
      uv run alembic upgrade head &&
      uv run python scripts/seed_auth_rbac.py &&
      uv run python scripts/seed_quotify.py &&
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    environment:
      APP_ENV: test
      APP_DEBUG: "false"
      PYTHONPATH: /app
      POSTGRES_HOST: postgres-test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-test:5432/app_test
      REDIS_URL: redis://redis-test:6379/0
      SMTP_HOST: mailpit-test
      SMTP_PORT: 1025
      # Mỗi test E2E đăng nhập lại; giới hạn 5 lần/phút mặc định làm các test chạy sát nhau bị 429.
      RATE_LIMIT_AUTH_LOGIN: "100"
      # Telegram bật nhưng trỏ tới Telegram giả (service fake-telegram), không bao giờ ra internet.
      TELEGRAM_ENABLED: "true"
      TELEGRAM_MODE: webhook
      TELEGRAM_BOT_TOKEN: e2e-fake-bot-token
      TELEGRAM_BOT_USERNAME: quotify_e2e_bot
      TELEGRAM_WEBHOOK_SECRET: "${E2E_TELEGRAM_WEBHOOK_SECRET:-e2e_webhook_secret_value}"
      TELEGRAM_API_BASE_URL: http://fake-telegram:8081
      # Chatbot tắt trong E2E dù .env của dev có bật (không có worker thì tin chỉ xếp hàng); thử chatbot:
      # E2E_CHATBOT_ENABLED=true docker compose -f docker-compose.test.yml --profile chatbot up ...
      CHATBOT_ENABLED: "${E2E_CHATBOT_ENABLED:-false}"
      # Chuông của chatbot đọc REDIS_HOST (không đọc REDIS_URL); .env của dev đặt nó là `redis`.
      REDIS_HOST: redis-test
    depends_on:
      postgres-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mailpit-test:
        condition: service_healthy
      fake-telegram:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  e2e-test:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: e2e
    command: sh -lc "npm run test:e2e:docker"
    environment:
      E2E_ADMIN_EMAIL: "${AUTH_SEED_ADMIN_EMAIL:?AUTH_SEED_ADMIN_EMAIL is required for E2E tests}"
      E2E_ADMIN_PASSWORD: "${AUTH_SEED_ADMIN_PASSWORD:?AUTH_SEED_ADMIN_PASSWORD is required for E2E tests}"
      E2E_TELEGRAM_WEBHOOK_SECRET: "${E2E_TELEGRAM_WEBHOOK_SECRET:-e2e_webhook_secret_value}"
      E2E_FAKE_TELEGRAM_URL: http://fake-telegram:8081
    volumes:
      - ./frontend/test-results:/app/test-results
      - ./frontend/playwright-report:/app/playwright-report
    depends_on:
      frontend-e2e:
        condition: service_healthy

  fake-telegram:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    command: python scripts/fake_telegram_server.py --port 8081
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8081/health", timeout=3)
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  postgres-test:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: app_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d app_test
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  minio-test:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - minio_test_data:/data

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_test_data:/data

  mailpit-test:
    image: axllent/mailpit:v1.21
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker-test:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    command: >
      sh -lc "uv sync &&
      uv run arq app.worker.WorkerSettings"
    depends_on:
      postgres-test:
        condition: service_healthy
      minio-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      mailpit-test:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: test
      APP_DEBUG: "false"
      PYTHONPATH: /app
      POSTGRES_HOST: postgres-test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-test:5432/app_test
      MINIO_ENDPOINT: minio-test:9000
      REDIS_URL: redis://redis-test:6379/0
      SMTP_HOST: mailpit-test
      SMTP_PORT: 1025
      # Worker kiểm thử không bao giờ được gọi Telegram thật (token dev nằm trong .env).
      TELEGRAM_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_BOT_USERNAME: ""
      TELEGRAM_WEBHOOK_SECRET: ""
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - ./backups:/app/backups

  # Worker của chatbot cho kiểm thử, opt-in (`--profile chatbot`) nên `make docker-test` mặc định không
  # chạy nó. Chỉ nói chuyện với fake-telegram; cần backend-e2e bật cờ bằng E2E_CHATBOT_ENABLED=true.
  bot-worker-test:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      target: dev
    profiles:
      - chatbot
    command: >
      sh -lc "uv sync &&
      exec uv run arq app.bot_worker.BotWorkerSettings"
    stop_grace_period: 30s
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
      fake-telegram:
        condition: service_healthy
      # backend-e2e chạy migration trên app_test: thiếu nó thì hộp thư chưa có bảng.
      backend-e2e:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: test
      APP_DEBUG: "false"
      PYTHONPATH: /app
      POSTGRES_HOST: postgres-test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres-test:5432/app_test
      REDIS_URL: redis://redis-test:6379/0
      # arq đọc REDIS_HOST (không đọc REDIS_URL); .env của dev đặt nó là `redis`.
      REDIS_HOST: redis-test
      CHATBOT_ENABLED: "true"
      BOT_STUB_DELAY_SECONDS: "0"
      # Token và địa chỉ giả ghi đè token dev trong .env: không bao giờ ra internet.
      TELEGRAM_ENABLED: "true"
      TELEGRAM_BOT_TOKEN: e2e-fake-bot-token
      TELEGRAM_BOT_USERNAME: quotify_e2e_bot
      TELEGRAM_API_BASE_URL: http://fake-telegram:8081
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv

volumes:
  postgres_test_data:
  minio_test_data:
  redis_test_data:
  backend_venv:

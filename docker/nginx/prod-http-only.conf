upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

# Cấu hình tạm thời khi CHƯA sẵn sàng bật SSL — chỉ phục vụ HTTP trên cổng 80,
# không có redirect sang HTTPS. Dùng bằng cách đặt NGINX_CONF_FILE=prod-http-only.conf
# trong .env production rồi `docker compose -f docker-compose.prod.yml up -d
# reverse-proxy`. Xem "Chạy production không cần SSL" trong
# docs/runbooks/deploy-vps-production.md để biết các biến .env khác cần đổi
# theo (AUTH_REFRESH_COOKIE_SECURE, CORS_ORIGINS) và cách chuyển lại sang
# prod.conf (có SSL) khi sẵn sàng.
server {
    listen 80;
    server_name quotify.honghafeed.com.vn _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

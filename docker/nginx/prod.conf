upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

# Port 80: ACME challenge cho certbot (webroot) + /health cho healthcheck nội bộ,
# tất cả traffic khác redirect sang HTTPS. Xem docs/runbooks/deploy-vps-production.md
# cho quy trình bootstrap chứng chỉ lần đầu trước khi 443 có thể start.
server {
    listen 80;
    server_name quotify.honghafeed.com.vn _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name quotify.honghafeed.com.vn;

    ssl_certificate /etc/letsencrypt/live/quotify.honghafeed.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quotify.honghafeed.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location = /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

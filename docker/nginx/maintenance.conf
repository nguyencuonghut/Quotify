# Chế độ bảo trì: mọi yêu cầu trả 503 kèm trang thông báo, không gọi backend/frontend.
# Bật: đặt NGINX_CONF_FILE=maintenance.conf trong .env rồi
#   docker compose -f docker-compose.prod.yml up -d --force-recreate reverse-proxy
# Tắt: đặt lại NGINX_CONF_FILE=prod.conf và chạy lại lệnh trên. Xem mục 13.2 của
# docs/runbooks/deploy-vps-production.md.

# Port 80: ACME challenge vẫn hoạt động (gia hạn chứng chỉ), /health trả 200 để
# healthcheck của container reverse-proxy vẫn đạt, còn lại chuyển sang HTTPS.
server {
    listen 80;
    server_name quotify.honghafeed.com.vn _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        default_type text/plain;
        return 200 "maintenance\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name quotify.honghafeed.com.vn;

    ssl_certificate /etc/letsencrypt/live/quotify.honghafeed.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quotify.honghafeed.com.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Telegram thử lại webhook khi nhận 503, nên không mất update trong lúc bảo trì.
    error_page 503 @maintenance;

    location / {
        return 503;
    }

    location @maintenance {
        default_type text/html;
        add_header Retry-After 600 always;
        return 503 '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotify đang bảo trì</title></head><body style="font-family:sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem;text-align:center"><h1>Quotify đang bảo trì</h1><p>Hệ thống đang được cập nhật, vui lòng quay lại sau ít phút.</p></body></html>';
    }
}
